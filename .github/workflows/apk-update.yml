name: 同步最新APK

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 YYGJ 最新 APK
        env:
          PAT: ${{ secrets.GHP_TOKEN }}
        run: |
          mkdir -p apk
          LATEST_TAG=$(curl -s -H "Authorization: token $PAT" \
            "https://api.github.com/repos/NJS98-UI/YYGJ/releases/latest" | \
            python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('tag_name',''))")
          ASSET_URL=$(curl -s -H "Authorization: token $PAT" \
            "https://api.github.com/repos/NJS98-UI/YYGJ/releases/latest" | \
            python3 -c "import json,sys;d=json.load(sys.stdin);print(d['assets'][0]['url'] if 'assets' in d and d['assets'] else '')")
          echo "YYGJ 最新 Release: $LATEST_TAG"
          if [ -n "$ASSET_URL" ]; then
            curl -sL --fail -H "Authorization: token $PAT" \
              -H "Accept: application/octet-stream" \
              -o "apk/冥城应用商店.apk" "$ASSET_URL"
            echo "APK 大小: $(du -h 'apk/冥城应用商店.apk' | cut -f1)"
          else
            echo "获取资产 URL 失败"
            exit 1
          fi

      - name: 提交变更
        run: |
          git config user.name "MCity Bot"
          git config user.email "dev@mcity.com"
          if git status --porcelain | grep -q "apk/"; then
            git add "apk/冥城应用商店.apk"
            git commit -m "sync: 更新最新 APK $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)"
            git push origin main
            echo "已同步"
          else
            echo "无变化"
          fi