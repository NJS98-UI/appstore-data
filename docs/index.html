<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应用商店更新检测</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.header { background: #1e293b; border-bottom: 1px solid #334155; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 22px; color: #f1f5f9; }
.header .subtitle { color: #94a3b8; font-size: 13px; margin-top: 4px; }
.status-bar { display: flex; gap: 16px; padding: 16px 24px; background: #1e293b; border-bottom: 1px solid #334155; flex-wrap: wrap; }
.status-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #cbd5e1; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; }
.status-dot.ok { background: #22c55e; }
.status-dot.warn { background: #eab308; }
.status-dot.error { background: #ef4444; }
.main { padding: 24px; max-width: 1200px; margin: 0 auto; }
.loading { text-align: center; padding: 60px 20px; color: #94a3b8; }
.loading .spinner { width: 32px; height: 32px; border: 3px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { background: #7f1d1d; border: 1px solid #991b1b; border-radius: 8px; padding: 20px; text-align: center; color: #fca5a5; }
.empty { text-align: center; padding: 40px 20px; color: #64748b; }
.diff-list { display: grid; gap: 12px; }
.diff-item { background: #1e293b; border-radius: 8px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-left: 3px solid transparent; }
.diff-item.added { border-left-color: #22c55e; }
.diff-item.updated { border-left-color: #3b82f6; }
.diff-item.removed { border-left-color: #ef4444; }
.diff-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; flex-shrink: 0; }
.diff-badge.added { background: #166534; color: #86efac; }
.diff-badge.updated { background: #1e3a5f; color: #93c5fd; }
.diff-badge.removed { background: #7f1d1d; color: #fca5a5; }
.diff-name { font-size: 14px; font-weight: 500; flex: 1; }
.diff-version { font-size: 12px; color: #94a3b8; }
.diff-arrow { color: #64748b; margin: 0 6px; }
.diff-type { font-size: 11px; color: #64748b; padding: 2px 6px; background: #334155; border-radius: 4px; }
.app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.app-card { background: #1e293b; border-radius: 8px; padding: 14px; }
.app-name { font-size: 14px; font-weight: 600; color: #f1f5f9; margin-bottom: 4px; }
.app-version { font-size: 12px; color: #94a3b8; }
.app-category { font-size: 11px; color: #64748b; margin-top: 6px; }
.controls { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
.refresh-btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; }
.refresh-btn:hover { background: #2563eb; }
.tabs { display: flex; gap: 4px; background: #1e293b; border-radius: 8px; padding: 4px; margin-bottom: 20px; }
.tab { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; color: #94a3b8; border: none; background: none; }
.tab.active { background: #3b82f6; color: white; }
.tab-count { font-size: 11px; margin-left: 4px; opacity: 0.7; }
@media (max-width: 640px) {
  .header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .status-bar { flex-direction: column; gap: 8px; }
}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>应用商店更新检测</h1>
    <div class="subtitle">对比已同步数据与作者最新数据，检测应用更新</div>
  </div>
  <button class="refresh-btn" onclick="checkNow()">检查更新</button>
</div>

<div class="status-bar" id="statusBar">
  <div class="status-item"><span class="status-dot" id="syncDot"></span><span id="syncStatus">加载中...</span></div>
  <div class="status-item">应用总数: <span id="appCount">-</span></div>
  <div class="status-item">上次同步: <span id="lastSync">-</span></div>
  <div class="status-item">上次检测: <span id="lastCheck">-</span></div>
</div>

<div class="main">
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="diff" onclick="switchTab('diff')">更新差异</button>
    <button class="tab" data-tab="apps" onclick="switchTab('apps')">所有应用</button>
  </div>

  <div id="diffView">
    <div class="section-title">检测结果</div>
    <div class="loading" id="diffLoading">
      <div class="spinner"></div>
      <div>正在检测更新...</div>
    </div>
    <div id="diffContent"></div>
  </div>

  <div id="appsView" style="display:none">
    <div class="section-title">应用列表</div>
    <div class="loading" id="appsLoading">
      <div class="spinner"></div>
      <div>正在加载...</div>
    </div>
    <div id="appsContent"></div>
  </div>
</div>

<script>
const STORE_URL = "https://fastly.jsdelivr.net/gh/NJS98-UI/appstore-data@main/appstore.json";
const SNAPSHOT_URL = "https://fastly.jsdelivr.net/gh/NJS98-UI/appstore-data@main/docs/latest_author.json";
const CDN_FALLBACKS = [
  "https://gcore.jsdelivr.net/gh/NJS98-UI/appstore-data@main/",
  "https://jsdelivr.b-cdn.net/gh/NJS98-UI/appstore-data@main/",
  "https://testingcf.jsdelivr.net/gh/NJS98-UI/appstore-data@main/"
];

async function fetchJSON(url) {
  const errors = [];
  const tryUrl = async (u) => {
    const r = await fetch(u);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  };
  try {
    return await tryUrl(url);
  } catch (e) {
    errors.push(e.message);
  }
  for (const cdn of CDN_FALLBACKS) {
    const u = cdn + url.replace(/^https:\/\/fastly\.jsdelivr\.net\/gh\/NJS98-UI\/appstore-data@main\//, '');
    try {
      return await tryUrl(u);
    } catch (e) {
      errors.push(e.message);
    }
  }
  throw new Error(errors.join("; "));
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function renderDiff(added, updated, removed) {
  const total = added.length + updated.length + removed.length;
  if (total === 0) {
    return '<div class="empty">与作者服务器完全一致，无需更新</div>';
  }
  let html = '<div class="diff-list">';
  for (const a of added) {
    html += '<div class="diff-item added"><span class="diff-badge added">新增</span><span class="diff-name">' + esc(a.name) + '</span><span class="diff-version">' + esc(a.version) + '</span><span class="diff-type">' + esc(a.type) + '</span></div>';
  }
  for (const { from, to } of updated) {
    html += '<div class="diff-item updated"><span class="diff-badge updated">更新</span><span class="diff-name">' + esc(from.name) + '</span><span class="diff-version">' + esc(from.version) + ' <span class="diff-arrow">→</span> ' + esc(to.version) + '</span><span class="diff-type">' + esc(from.type) + '</span></div>';
  }
  for (const a of removed) {
    html += '<div class="diff-item removed"><span class="diff-badge removed">移除</span><span class="diff-name">' + esc(a.name) + '</span><span class="diff-version">' + esc(a.version) + '</span><span class="diff-type">' + esc(a.type) + '</span></div>';
  }
  html += '</div>';
  return html;
}

function renderApps(storeData) {
  let html = '';
  for (const cat of storeData.categories) {
    html += '<div class="section-title" style="margin-top:24px">' + esc(cat.name) + ' (' + cat.apps.length + ')</div><div class="app-grid">';
    for (const app of cat.apps) {
      html += '<div class="app-card"><div class="app-name">' + esc(app.name) + '</div><div class="app-version">' + esc(app.version) + (app.size ? ' / ' + esc(app.size) : '') + '</div><div class="app-category">' + esc(cat.name) + '</div></div>';
    }
    html += '</div>';
  }
  return html;
}

async function checkNow() {
  document.getElementById('diffLoading').style.display = 'block';
  document.getElementById('diffContent').innerHTML = '';
  document.getElementById('lastCheck').textContent = new Date().toLocaleString('zh-CN');

  try {
    const [store, snapshot] = await Promise.all([
      fetchJSON(STORE_URL).catch(e => { throw new Error("无法获取商店数据: " + e.message); }),
      fetchJSON(SNAPSHOT_URL).catch(e => null)
    ]);

    const total = store.categories.reduce((s, c) => s + c.apps.length, 0);
    document.getElementById('appCount').textContent = total;
    document.getElementById('lastSync').textContent = store.updateTime || '未知';
    document.getElementById('appsContent').innerHTML = renderApps(store);

    if (!snapshot) {
      document.getElementById('syncDot').className = 'status-dot ok';
      document.getElementById('syncStatus').textContent = '已同步(快照未就绪)';
      document.getElementById('diffContent').innerHTML = '<div class="empty">快照数据尚未生成，下次定时同步后自动可用</div>';
      document.getElementById('diffLoading').style.display = 'none';
      return;
    }

    const storeFlat = {};
    for (const cat of store.categories) {
      for (const a of cat.apps) {
        storeFlat[a.name] = { version: a.version, type: cat.name };
      }
    }
    const snapMap = {};
    for (const a of snapshot.apps) {
      snapMap[a.name] = { version: a.version, type: a.type };
    }

    const added = [], updated = [], removed = [];
    for (const name in snapMap) {
      const s = storeFlat[name];
      if (!s) { added.push({ name, version: snapMap[name].version, type: snapMap[name].type }); }
      else if (s.version !== snapMap[name].version) { updated.push({ from: { name, version: s.version, type: s.type }, to: snapMap[name] }); }
    }
    for (const name in storeFlat) {
      if (!snapMap[name]) { removed.push({ name, version: storeFlat[name].version, type: storeFlat[name].type }); }
    }

    document.getElementById('diffContent').innerHTML = renderDiff(added, updated, removed);
    document.getElementById('diffLoading').style.display = 'none';

    if (added.length + updated.length + removed.length > 0) {
      document.getElementById('syncDot').className = 'status-dot warn';
      document.getElementById('syncStatus').textContent = '有更新待同步(' + (added.length + updated.length) + '项)';
    } else {
      document.getElementById('syncDot').className = 'status-dot ok';
      document.getElementById('syncStatus').textContent = '已同步';
    }
  } catch (e) {
    document.getElementById('diffContent').innerHTML = '<div class="error-box">' + esc(e.message) + '</div>';
    document.getElementById('diffLoading').style.display = 'none';
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
  document.getElementById('diffView').style.display = tab === 'diff' ? 'block' : 'none';
  document.getElementById('appsView').style.display = tab === 'apps' ? 'block' : 'none';
}

window.onload = checkNow;
</script>
</body>
</html>
