name: 同步作者商店更新

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: author-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行同步脚本
        run: python3 sync_author.py

      - name: 提交变更
        run: |
          git config user.name "MCity Bot"
          git config user.email "dev@mcity.com"
          CHANGED=$(git status --porcelain | grep -E "appstore\.json|latest_author\.json|icons/" || true)
          if [ -n "$CHANGED" ]; then
            COUNT=$(python3 -c "
import json
with open('appstore.json', encoding='utf-8') as f:
    d = json.load(f)
print(sum(len(c['apps']) for c in d['categories']))
")
            git add appstore.json
            git add -f docs/latest_author.json
            git add -A icons/
            git commit -m "sync: 同步作者商店更新 $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M) (共${COUNT}个应用)"
            git push origin main 2>&1
            echo "已同步"
          else
            echo "无变化"
          fi